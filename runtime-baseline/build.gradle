plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.147'
}

// Separate launcher only. No source mod, no upstream development modpack.
// The isolated Minecraft runtime uses Java 25. Mod artifacts remain Java 21 bytecode.
java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }
repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = 'https://libraries.minecraft.net' }
    maven { url = 'https://maven.architectury.dev' }
    maven { url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
}

abstract class BaselineWindowsX64NativesRule implements ComponentMetadataRule {
    void execute(ComponentMetadataContext context) {
        context.details.withVariant('clientWindowsNatives') {
            withDependencies {
                removeAll { dependency ->
                    dependency.group == 'org.lwjgl' && dependency.artifactSelectors.any {
                        it.classifier in ['natives-windows-x86', 'natives-windows-arm64']
                    }
                }
            }
        }
    }
}
dependencies.components.withModule('net.neoforged:minecraft-dependencies', BaselineWindowsX64NativesRule)
configurations.configureEach {
    resolutionStrategy {
        ['lwjgl', 'lwjgl-glfw', 'lwjgl-opengl', 'lwjgl-vulkan', 'lwjgl-openal',
         'lwjgl-jemalloc', 'lwjgl-tinyfd', 'lwjgl-freetype', 'lwjgl-vma'].each {
            force "org.lwjgl:${it}:3.3.4"
        }
        force 'org.lwjgl:lwjgl-stb:3.3.3'
    }
}
dependencies {
    runtimeOnly files(providers.gradleProperty('candidate_sr_jar').orElse('../builds/baseline/super_resolution-neoforge-1.21..1.21.1-0.9.2-alpha.1+dev.f0e41bf8.opengl-fg-backpressure.jar').get())
    runtimeOnly files(providers.gradleProperty('candidate_wisteria_jar').orElse('../builds/baseline/wisteria-neoforge-1.21.1-0.1.0-alpha.1+1.21.1-fsr-backpressure.jar').get())
    runtimeOnly 'maven.modrinth:iris:1.8.8+1.21.1-neoforge-neoforge,1.21.1'
    runtimeOnly 'maven.modrinth:sodium:mc1.21.1-0.6.13-neoforge-neoforge,1.21.1'
    runtimeOnly 'dev.architectury:architectury-neoforge:13.0.6'
    runtimeOnly 'org.anarres:jcpp:1.4.14'
}
neoForge {
    version = '21.1.219'
    runs {
        client {
            client()
            gameDirectory = file('instance')
            // Same LWJGL compatibility property as SR upstream's development run.
            jvmArgument '-Dsodium.checks.issue2561=false'
            jvmArgument '-Xmx4G'
            jvmArgument "-XX:ErrorFile=${file('../logs/runtime/hs_err_pid%p.log').absolutePath}"
            jvmArgument '-Dorg.lwjgl.util.Debug=true'
            jvmArgument '-Dsr.baselineDiagnostics=true'
            if (providers.gradleProperty('dlssg_run_dir').isPresent()) {
                def experimentMode = providers.gradleProperty('dlssg_mode').orElse('shadow').get()
                if (!(experimentMode in ['shadow', 'presentation'])) throw new GradleException('Unknown DLSS-G experiment mode')
                def experimentDir = file(providers.gradleProperty('dlssg_run_dir').get()).absolutePath
                jvmArgument '-Dwisteria.dlssg.enabled=true'
                jvmArgument "-Dwisteria.dlssg.mode=${experimentMode}"
                if (providers.gradleProperty('dlssg_requested_count').isPresent()) {
                    def requestedCount = providers.gradleProperty('dlssg_requested_count').get().toInteger()
                    if (requestedCount < 1 || requestedCount > 4) throw new GradleException('Phase supports x2 through x5 only')
                    jvmArgument "-Dwisteria.dlssg.requestedCount=${requestedCount}"
                }
                jvmArgument "-Dwisteria.dlssg.runDir=${experimentDir}"
                if (providers.gradleProperty('dlssg_image_diagnostic').orElse('false').get() == 'true') {
                    jvmArgument '-Dwisteria.dlssg.imageDiagnostic=true'
                }
                jvmArgument "-Dwisteria.dlssg.externalDll=${file(experimentDir + '/component/version.dll').absolutePath}"
                jvmArgument "-Dwisteria.dlssg.runtimeDir=${file(experimentDir + '/stock-runtime').absolutePath}"
            }
        }
    }
}
tasks.register('auditRuntimeProfile') {
    doLast {
        def artifacts = configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts
        artifacts.each { println "BASELINE_ARTIFACT ${it.moduleVersion.id} ${it.file.name}" }
        def disallowed = artifacts.findAll {
            it.file.name.toLowerCase() =~ /distanthorizons|ssrd|wisterianative|xaero|spark|reeses|simple.clouds/
        }
        if (disallowed) throw new GradleException("Non-minimal runtime dependencies: ${disallowed*.file*.name}")
    }
}
tasks.register('auditRuntimeJava') {
    doLast {
        def launcher = tasks.named('runClient').get().javaLauncher.get()
        if (launcher.metadata.languageVersion.asInt() != 25) {
            throw new GradleException('The isolated Minecraft runtime requires Java 25')
        }
        println "MINECRAFT_RUNTIME_JAVA ${launcher.metadata.languageVersion}"
        println "MINECRAFT_RUNTIME_EXECUTABLE ${launcher.executablePath.asFile.absolutePath}"
        println "GRADLE_JAVA_VERSION ${System.getProperty('java.version')}"
        println "GRADLE_JAVA_HOME ${System.getProperty('java.home')}"
        def versionProcess = new ProcessBuilder(launcher.executablePath.asFile.absolutePath, '--version').redirectErrorStream(true).start()
        def versionOutput = versionProcess.inputStream.text
        if (versionProcess.waitFor() != 0 || !versionOutput.contains('25.0.4')) {
            throw new GradleException('runClient executable must be Java 25.0.4')
        }
        println versionOutput.trim()
        println 'MOD_BYTECODE_TARGET 21 (prebuilt external artifacts)'
    }
}
