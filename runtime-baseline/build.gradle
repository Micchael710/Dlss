plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.147'
}

// Separate launcher only. No source mod, no upstream development modpack.
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = 'https://libraries.minecraft.net' }
    maven { url = 'https://maven.architectury.dev' }
    maven { url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
}

abstract class BaselineWindowsX64NativesRule implements ComponentMetadataRule {
    void execute(ComponentMetadataContext context) {
        context.details.withVariant('clientWindowsNatives') {
            withDependencies {
                removeAll { dependency ->
                    dependency.group == 'org.lwjgl' && dependency.artifactSelectors.any {
                        it.classifier in ['natives-windows-x86', 'natives-windows-arm64']
                    }
                }
            }
        }
    }
}
dependencies.components.withModule('net.neoforged:minecraft-dependencies', BaselineWindowsX64NativesRule)
configurations.configureEach {
    resolutionStrategy {
        ['lwjgl', 'lwjgl-glfw', 'lwjgl-opengl', 'lwjgl-vulkan', 'lwjgl-openal',
         'lwjgl-jemalloc', 'lwjgl-tinyfd', 'lwjgl-freetype', 'lwjgl-vma'].each {
            force "org.lwjgl:${it}:3.3.4"
        }
        force 'org.lwjgl:lwjgl-stb:3.3.3'
    }
}
dependencies {
    runtimeOnly files('../builds/baseline/super_resolution-neoforge-1.21..1.21.1-0.9.2-alpha.1+dev.f0e41bf8.opengl-fg-backpressure.jar')
    runtimeOnly files('../builds/baseline/wisteria-neoforge-1.21.1-0.1.0-alpha.1+1.21.1-fsr-backpressure.jar')
    runtimeOnly 'maven.modrinth:iris:1.8.8+1.21.1-neoforge-neoforge,1.21.1'
    runtimeOnly 'maven.modrinth:sodium:mc1.21.1-0.6.13-neoforge-neoforge,1.21.1'
    runtimeOnly 'dev.architectury:architectury-neoforge:13.0.6'
    runtimeOnly 'org.anarres:jcpp:1.4.14'
}
neoForge {
    version = '21.1.219'
    runs {
        client {
            client()
            gameDirectory = file('instance')
            // Same LWJGL compatibility property as SR upstream's development run.
            jvmArgument '-Dsodium.checks.issue2561=false'
            jvmArgument '-Xmx4G'
            jvmArgument "-XX:ErrorFile=${file('../logs/runtime/hs_err_pid%p.log').absolutePath}"
            jvmArgument '-Dorg.lwjgl.util.Debug=true'
            jvmArgument '-Dsr.baselineDiagnostics=true'
        }
    }
}
tasks.register('auditRuntimeProfile') {
    doLast {
        def artifacts = configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts
        artifacts.each { println "BASELINE_ARTIFACT ${it.moduleVersion.id} ${it.file.name}" }
        def disallowed = artifacts.findAll {
            it.file.name.toLowerCase() =~ /distanthorizons|ssrd|wisterianative|xaero|spark|reeses|simple.clouds/
        }
        if (disallowed) throw new GradleException("Non-minimal runtime dependencies: ${disallowed*.file*.name}")
    }
}
